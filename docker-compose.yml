services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    depends_on:
      database:
        condition: service_healthy
    networks:
      - skda

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - skda

  database:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-skda}
      MARIADB_USER: ${DB_USERNAME:-skda}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the server .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the server .env}
    volumes:
      - skda-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - skda

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - skda

volumes:
  skda-db:

networks:
  skda:
    driver: bridge
